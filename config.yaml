# Configuration de COSMOS-AI.
# Les clés d'API ne sont JAMAIS écrites ici : seul le NOM de la variable
# d'environnement est indiqué (api_key_env).

# manual : chaque Reel attend ta validation avant publication.
# auto   : publication automatique (à activer seulement quand la fiabilité est démontrée).
mode: manual

database_path: data/cosmos.db
posts_per_day: 2
similarity_threshold: 0.8   # au-dessus, un sujet est considéré comme déjà traité

content:
  # Sources d'actualités (flux RSS). Une source en panne est ignorée, les autres continuent.
  # `publisher` regroupe les flux d'un même organisme : deux flux de la NASA comptent pour une
  # seule source dans le classement. Plus il y a d'éditeurs indépendants qui parlent d'un sujet,
  # plus il est jugé populaire. Vérifie les flux avec `python -m cosmos_ai news`.
  #
  # Testés (flux valides et à jour) : NASA, The Space Review, Space.com, Universe Today,
  # Phys.org, Futura Espace.  Non testés : SpaceNews, ScienceDaily (adresses courantes, mais
  # non vérifiables depuis l'environnement de développement : `news` dira s'ils répondent).
  sources:
    # --- anglais ---
    - name: NASA
      url: https://www.nasa.gov/feed/
      publisher: NASA
    - name: NASA communiqués
      url: https://www.nasa.gov/news-release/feed/
      publisher: NASA
    - name: NASA Station spatiale
      url: https://www.nasa.gov/missions/station/feed/
      publisher: NASA
    - name: Space.com
      url: https://www.space.com/feeds/news
      publisher: Space.com
    - name: Universe Today
      url: https://www.universetoday.com/feed
      publisher: Universe Today
    - name: Phys.org Espace
      url: https://phys.org/rss-feed/space-news/
      publisher: Phys.org
    - name: The Space Review
      url: https://thespacereview.com/articles.xml
      publisher: The Space Review
    - name: ESA Exploration Science
      url: https://explorationscience.esa.int/feed/
      publisher: ESA
    - name: SpaceNews          # non testé
      url: https://spacenews.com/feed/
      publisher: SpaceNews
    - name: ScienceDaily Espace    # non testé
      url: https://www.sciencedaily.com/rss/space_time.xml
      publisher: ScienceDaily
    # --- français ---
    - name: Futura Espace
      url: https://www.futura-sciences.com/rss/espace/actualites.xml
      publisher: Futura
    #
    # Flux écartés après test : ancien flux ESA (esa.int/rssfeed/..., erreur 404), blog JPL et
    # ESA Science (derniers articles de 2020 à 2023), science.nasa.gov/feed (XML invalide).
    # Autres flux officiels : https://www.nasa.gov/rss-feeds et https://futura-sciences.com/flux-rss/

  fetch_articles: true      # lit l'article complet du sujet choisi (meilleure exactitude)

  max_age_days: 14          # on ignore les actualités plus anciennes
  candidates: 8             # nombre de sujets présentés à l'IA pour le choix
  tone: tu                  # tu | vous
  # Phrase finale de la voix off ET de la légende : pousse à s'abonner, commenter, partager.
  # Vide = aucun appel. L'IA termine déjà son texte par une question qui invite à commenter.
  call_to_action: "Si tu veux explorer l'Univers chaque jour, abonne-toi à Cosmos en Poche, dis-moi ta réponse en commentaire et partage cette vidéo."
  min_seconds: 30           # durée du Reel : 30 à 90 secondes
  target_seconds: 50
  max_seconds: 90

  # Mots qui font monter un sujet dans le classement (détection des sujets populaires).
  interest_keywords:
    - trou noir
    - galaxie
    - exoplanète
    - Mars
    - Lune
    - Artemis
    - James Webb
    - Big Bang
    - supernova
    - télescope
    - astéroïde
    - mission
    - lancement
    - black hole
    - galaxy
    - exoplanet
    - Moon
    - telescope
    - asteroid
    - launch
    - quantum
    - dark matter
    - dark energy

  # Sujets écartés : les titres contenant un de ces mots (administration, cérémonies...).
  exclude_keywords:
    - honor award
    - ceremony
    - seed funding
    - small business
    - status update
    - "challenge:"
    - employees
    - budget
    - procurement
    - hiring
    - webinar
    - podcast
    - on this day in space
    - lecture series
    - seminar
    - best telescope
    - best binoculars
    - best deals
    - black friday
    - bon plan
    - job opening

  # Sujets de culture scientifique, utilisés seulement quand aucune actualité n'est exploitable.
  evergreen_topics:
    - Et si le Soleil disparaissait demain ?
    - Que se passerait-il si on enlevait le CO2 de Vénus ?
    - Vénus ou Mars, laquelle rendre habitable ?
    - Pourquoi Vénus est-elle plus chaude que Mercure ?
    - Que se passe-t-il quand on tombe dans un trou noir ?
    - Comment sait-on que l'Univers est en expansion ?
    - Pourquoi voit-on le passé quand on regarde les étoiles ?
    - Qu'est-ce que la matière noire, et pourquoi la cherche-t-on ?
    - Combien de temps faudrait-il pour atteindre l'étoile la plus proche ?
    - Qu'est-ce qu'une exoplanète, et comment les découvre-t-on ?

  # Identité éditoriale : transmise telle quelle à l'IA comme consignes.
  editorial:
    identity:
      - Cosmos en Poche doit donner l'impression d'un média scientifique professionnel.
      - Identité scientifique, cinématographique et accessible, avec une touche de mystère.
      - Éveiller la curiosité et faire découvrir les mystères de l'Univers.
      - Expliquer les grandes découvertes scientifiques et rendre accessibles les phénomènes complexes.
      - Donner envie d'apprendre et de partager.
    voice:
      - Français impeccable, naturel et accessible.
      - Vocabulaire scientifique précis, mais expliqué simplement.
      - Ton intelligent, captivant et mystérieux.
      - Pas de langage enfantin, pas d'expressions trop familières.
    style:
      - Des accroches intrigantes.
      - Des explications progressives.
      - Des faits scientifiques vérifiables.
      - Des analogies intelligentes.
      - Des conclusions qui invitent à réfléchir.
    priority_topics:
      - Astronomie et astrophysique
      - Trous noirs et galaxies
      - Exploration spatiale
      - Physique quantique
      - Origine et évolution de l'Univers
      - Intelligence artificielle et technologies
      - Découvertes scientifiques récentes
      - Mystères encore inexpliqués par la science
    rules:
      - Aucune fausse information scientifique.
      - Aucune théorie complotiste présentée comme une vérité.
      - Aucune invention de citations de scientifiques.
      - Toujours distinguer les faits établis, les hypothèses et les spéculations.
      - Mentionner les sources scientifiques.
      - Éviter les titres trompeurs et le sensationnalisme.
      - Ne jamais sacrifier la précision scientifique pour obtenir des vues.
    example: >-
      Et si le Soleil disparaissait demain ? La Terre ne s'en rendrait pas compte immédiatement.
      Pendant environ huit minutes, notre planète continuerait de recevoir sa lumière.
      Voici pourquoi…

  # Identité visuelle : utilisée à partir de la phase 4 (production vidéo).
  visual:
    format: "9:16"
    palette:
      - bleu profond
      - noir spatial
      - touches lumineuses
    style:
      - Univers sombre et cinématographique.
      - Images astronomiques de haute qualité.
      - Typographie moderne et élégante.

# Production des Reels (phase 4). Rien n'est publié : la vidéo est créée dans output/.
video:
  voice: fr-FR-HenriNeural     # voix grave ; essaie aussi fr-FR-DeniseNeural (voix féminine)
  rate: "+0%"                  # vitesse : "-5%" plus posé, "+5%" plus dynamique
  fps: 60                      # images par seconde : 60 très fluide (montage long sur téléphone) ; 30 plus rapide
  max_images: 3                # nombre d'images différentes dans un Reel
  image_queries: 3             # recherches d'images demandées à l'IA
  output_dir: output
  font_name: Roboto            # police des sous-titres (Roboto existe sur Android)
  font_dir: ""                 # vide = /system/fonts si présent
  crf: 23                      # qualité vidéo (18 = très bonne, 28 = légère)
  seconds_per_plan: 10         # un plan (image ou vidéo) toutes les 10 s : une vidéo longue a plus de plans
  max_plans: 40                # plafond de plans par vidéo (limite téléchargements et durée du montage)
  max_clips: 3                 # courtes vidéos NASA mêlées aux images (0 = images seulement)
  clip_sources: [pexels, nasa] # d'où viennent les vidéos, à tour de rôle (Pexels demande PEXELS_API_KEY, gratuite)
  clip_quality: haute          # haute = 1080p (4K si disponible) ; standard = 720p, plus léger
  max_clip_mb: 80              # taille maximale d'une vidéo (Mo) : protège ton forfait Internet
  end_card: "ABONNE-TOI · COMMENTE · PARTAGE"   # carton de fin ; "" = aucun
  transition_seconds: 0.7      # durée du fondu entre deux plans
  music: true                  # musique d'ambiance sous la voix (générée, libre de droits)
  music_file: ""               # ou ta propre musique, ex. assets/musique.mp3 (droits à vérifier)
  music_volume: 0.2            # niveau de la musique : 0.05 (discrète) à 0.5 (forte)
  sfx: true                    # petits effets sonores aux transitions

llm:
  # Pause d'un fournisseur dont le quota est atteint, si celui-ci n'indique pas
  # lui-même quand réessayer.
  cooldown_seconds: 300
  # L'ordre de la liste = l'ordre d'essai. Le routeur bascule sur le suivant en cas
  # de quota atteint, d'indisponibilité, de délai dépassé ou de clé refusée.
  providers:
    - name: gemini              # fournisseur principal
      enabled: true
      model: ""                 # vide = modèle par défaut (gemini-3.1-flash-lite)
      api_key_env: GEMINI_API_KEY
      timeout_seconds: 30       # délai d'attente d'une requête
      max_retries: 1            # nouvelles tentatives si le service est indisponible
    - name: groq                # fournisseur secondaire
      enabled: true
      model: ""                 # vide = modèle par défaut (openai/gpt-oss-20b)
      api_key_env: GROQ_API_KEY
      timeout_seconds: 30
      max_retries: 1
    # Prévus pour plus tard (pas encore d'adaptateur) :
    - name: openrouter
      enabled: false
      api_key_env: OPENROUTER_API_KEY
    - name: ollama              # modèle local, gratuit, sans clé
      enabled: false
      base_url: http://localhost:11434
    - name: openai              # optionnel, désactivé tant qu'il n'y a pas de crédits
      enabled: false
      api_key_env: OPENAI_API_KEY
